services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python -m scripts.setup_demo first}
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - portfolio-db:/var/lib/postgresql/data
volumes:
  portfolio-db:
